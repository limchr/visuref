services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: visart
      POSTGRES_PASSWORD: visart
      POSTGRES_DB: visart
    ports:
      - "5678:5432"

  frontend:
    build: ./frontend
    working_dir: /usr/share/nginx/html
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/usr/share/nginx/html
