services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: visart
      POSTGRES_PASSWORD: visart
      POSTGRES_DB: visart
    ports:
      - "5678:5432"

  frontend:
    build: ./frontend
    working_dir: /usr/share/nginx/html
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend

  backend:
    environment:
      DATABASE_URL: postgresql+psycopg://visart:visart@db:5432/visart
    ports:
      - "5680:5678"
    volumes:
      - ./backend:/app
    command:
      - python
      - -m
      - debugpy
      - --listen
      - 0.0.0.0:5678
      - --wait-for-client
      - -m
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    depends_on:
      - db
